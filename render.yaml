# One-click deploy: https://render.com → New → Blueprint → this repo.
# Free tier note (ADR-0003): the instance sleeps when idle; first call
# after a nap takes ~30s. Fine for an instrument; know it's there.
services:
  - type: web
    name: your-first-instrument
    runtime: python
    plan: free
    buildCommand: pip install "mcp[cli]>=1.2,<2" "psycopg[binary]>=3.1" "PyJWT[crypto]>=2.8"
    startCommand: python server.py
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: NEON_AUTH_BASE_URL
        sync: false
      - key: PUBLIC_URL
        sync: false
